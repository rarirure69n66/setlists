<section class="song">
  <div class="meta">#1 / 02:05</div>
  <h2> DEAR FEELING - THE YELLOW MONKEY </h2>
  <p>不安と逃避を抱える青年が、「DEAR FEELING」に寄り添いを求める。
「感触」や「ストレス」といった内面と向き合い、
社会のプレッシャーから逃れたいが、
「そろそろアレが来るぜ」という言葉に苛まれ、
絶望的な問いかけを繰り返す。</p>
