<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Live Setlist</title>
<style>
body {
  background:#111;
  color:#eee;
  font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
  padding:24px;
}
header {
  margin-bottom:32px;
}
header h1 {
  font-size:32px;
  margin-bottom:8px;
}
.song {
  margin-bottom:36px;
  padding-bottom:20px;
  border-bottom:1px solid #333;
}
.song h2 {
  font-size:30px;
  margin-bottom:10px;
  color:#ffd966;
}
.song p {
  white-space:pre-wrap;
  line-height:1.7;
}
.meta {
  font-size:28px;
  opacity:0.7;
  margin-bottom:6px;
}
</style>
</head>
<body>
<header>
  <h1>Tonight's Live Setlist</h1>
</header>

<main>

<section class="song">
  <div class="meta">#1 / 03:22</div>
  <h2> ALRIGHT - THE YELLOW MONKEY </h2>
  <p>蛹から生まれ変わり、夢と罠、血と魂が交錯する。
コバルトの空の下、あなたとの刹那を噛み締め、
「準備ALRIGHT！」と、力で未来を掴む。
絶え間ない出会いと別れ、運命のタイマー。</p>
</section>


<section class="song">
  <div class="meta">#2 / 03:23</div>
  <h2> Love ＆ Peace - 吉井 和哉 </h2>
  <p>繰り返す喪失と憎悪、それでも「生」を信じる。
「愛」の重みと、終わらない争いへの警告。
平和への願いと、怖い夢。
「おはよう」という小さな希望。</p>
</section>

</main>

</body>
</html>
