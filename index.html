<!DOCTYPE html>

<header>
  <h1>Tonight's Live Setlist</h1>

<main>

<section class="song">
  <div class="meta">#1 / 01:00</div>
  <h2> ROCK STAR - THE YELLOW MONKEY </h2>
  <p>「ロックンロール」の歌詞要約：
テレパシーと誘惑、禁断の感情を抱く。A型の道徳心を嘲笑い、ロック・スターへの願望と幻滅を重ねる。現実を無視し、空に「欲をさらけ出す」しかないと訴える。
</p>
</section>


<section class="song">
  <div class="meta">#2 / 01:04</div>
  <h2> 楽園 - THE YELLOW MONKEY </h2>
  <p>楽園への渇望と、無意味な時間削り。苦悩を忘れ、自由への旅を求める。愛と絶望、痛みと喜びを抱え、赤い夕日を背に聖地を目指す。刹那の解放を謳い、永遠の碧空へと「MAKE YOU FREE」と宣言する。</p>
</section>

</main>
