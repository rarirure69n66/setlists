<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Live Setlist</title>
<style>
body {
  background:#111;
  color:#eee;
  font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
  padding:24px;
}
header {
  margin-bottom:32px;
}
header h1 {
  font-size:32px;
  margin-bottom:8px;
}
.song {
  margin-bottom:36px;
  padding-bottom:20px;
  border-bottom:1px solid #333;
}
.song h2 {
  font-size:30px;
  margin-bottom:10px;
  color:#ffd966;
}
.song p {
  white-space:pre-wrap;
  line-height:1.7;
}
.meta {
  font-size:28px;
  opacity:0.7;
  margin-bottom:6px;
}
</style>
</head>
<body>
<header>
  <h1>Tonight's Live Setlist</h1>
</header>

<main>

<section class="song">
  <div class="meta">#1 / 02:03</div>
  <h2> Tunnel Vision - Lenny Kravitz </h2>
  <p>都市の影、支配された月。
足音、ネコとの戯れ、混沌とした猫たち。
「ニャア」という問いかけ、無限の生まれ変わり。
「ロケンローパリ」、永遠の連れ去り。
精神の不安定さ、そして猫への愛着。</p>
</section>


<section class="song">
  <div class="meta">#2 / 02:24</div>
  <h2> 死神 - Lenny </h2>
  <p>罪と愛の虚無。呼吸のみで生きる、死神との対話。心臓のリズム、罪と愛の同一性を訴え、未だ歌う命。世界は待つ、十三夜へ続く。
</p>
</section>

</main>

</body>
</html>
