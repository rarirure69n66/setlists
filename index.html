<body>
<header>
  <h1>Tonight's Live Setlist</h1>
</header>

<main>

<section class="song">
  <div class="meta">#2 / 02:10</div>
  <h2> 追憶のマーメイド - THE YELLOW MONKEY </h2>
  <p>夜明けを失くす人魚の恋。若さゆれ、眩惑に溺れ、激痛を抱える。記憶にカギをかけ、燃え落ちる夏恋。永遠に続く苦しみ。</p>
</section>


<section class="song">
  <div class="meta">#3 / 02:15</div>
  <h2> SPARK - THE YELLOW MONKEY </h2>
  <p>絶望とスパーク。混沌に目覚める自我と、刹那の愛の激しさを描く。

「永遠」を否定し、一瞬の火花に身を委ねる。

「夜はスネーク」との対比で、愛の危険性と生命力示す。</p>
</section>

</main>
