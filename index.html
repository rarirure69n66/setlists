header {

<header>
  <h1>Tonight's Live Setlist</h1>
</header>

<main>

<section class="song">
  <div class="meta">#30 / 23:00</div>
  <h2> ネバーギブアップ - THE YELLOW MONKEY </h2>
  <p>若者の反抗と衝動、耽美への傾倒を歌う。夢中になって溺れる様、刹那の熱情と破滅への渇望を、「ネバーギブアップ」の叫びと共に表現。荒々しいエネルギーと繊細な感情の狭間で揺れ動く姿を、まるで音楽や芸術作品のように描き出す。</p>
</section>

</main>
